<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

<title>BullBear Market App Kaise Use Kare | App Guide</title>

<meta name="description"
      content="BullBear Market app guide. Learn trading, rewards, leaderboard, quiz, prediction, learning and virtual trading step by step.">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

body{
    background:#020817;
    font-family:Arial,sans-serif;
    color:white;
    overflow-x:hidden;
}

.header{

    position:sticky;
    top:0;
    z-index:999;

    background:#000814;
    border-bottom:2px solid #facc15;

    text-align:center;

    padding:14px 10px;

}

.logo{

    color:#22c55e;
    font-size:14px;
    font-weight:bold;
    margin-bottom:6px;

}

.heading{

    color:#facc15;
    font-size:24px;
    font-weight:bold;

}

.subHeading{

    color:#cbd5e1;
    font-size:14px;
    margin-top:5px;

}

.searchBox{

    width:92%;
    max-width:700px;

    margin:15px auto;

    background:white;
    color:#111;

    border-radius:30px;

    padding:12px 18px;

    font-size:15px;
    font-weight:600;

    box-shadow:0 0 15px rgba(255,255,255,.08);

}

.mainWrap{

    width:100%;
    max-width:900px;

    margin:auto;

    padding:10px;

}

.viewer{

    background:#111827;

    border-radius:20px;

    padding:10px;

    box-shadow:0 0 20px rgba(250,204,21,.08);

}

.imageWrap{

    width:100%;
    overflow:hidden;
    border-radius:16px;

}

#guideImage{

    width:100%;
    height:auto;
    display:block;

    border-radius:16px;

}

.counter{

    text-align:center;

    font-size:20px;
    font-weight:bold;

    color:#22c55e;

    margin-top:12px;

}

.controls{

    display:flex;

    justify-content:center;

    gap:10px;

    flex-wrap:wrap;

    margin-top:15px;

}

button{

    border:none;

    border-radius:10px;

    background:#facc15;

    color:black;

    font-size:15px;
    font-weight:bold;

    padding:12px 18px;

    cursor:pointer;

}

button:active{

    transform:scale(.97);

}

.footerText{

    text-align:center;

    color:#cbd5e1;

    font-size:14px;

    line-height:1.6;

    margin:20px 10px;

}

</style>

</head>


<body>


<div class="header">

    <div class="logo">
        BULLBEAR MARKET
    </div>

    <div class="heading">
        App Guide
    </div>

    <div class="subHeading">
        Learn • Practice • Compete • Earn
    </div>

</div>



<div class="searchBox">

🔍 bullbear market app kaise use kare

</div>



<div class="mainWrap">

    <div class="viewer">

        <div class="imageWrap">

            <img
                    id="guideImage"
                    src="https://bullbearmarket.in/images/guid1.png">

        </div>


        <div class="counter" id="counter">

            1 / 13

        </div>



        <div class="controls">

            <button onclick="prevImage()">
                ⬅ Previous
            </button>

            <button onclick="nextImage()">
                Next ➡
            </button>

        </div>


        <div class="footerText">

            Swipe left/right • Zoom in / Zoom out • Learn every feature step by step

        </div>

    </div>

</div>




<script>

let current = 1;
const total = 13;



function updateImage(){

    document.getElementById("guideImage").src =
        "https://bullbearmarket.in/images/guid" + current + ".png";


    document.getElementById("counter").innerText =
        current + " / " + total;

}



// next

function nextImage(){

    if(current < total){

        current++;

        updateImage();

    }

}



// prev

function prevImage(){

    if(current > 1){

        current--;

        updateImage();

    }

}



// swipe

let startX = 0;



document.addEventListener("touchstart", function(e){

    startX = e.changedTouches[0].screenX;

});



document.addEventListener("touchend", function(e){

    let endX = e.changedTouches[0].screenX;


    if(endX < startX - 50){

        nextImage();

    }


    if(endX > startX + 50){

        prevImage();

    }

});

</script>



</body>
</html>
