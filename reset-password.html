<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password - BullBear Market</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#020617);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  padding:30px;
  border-radius:20px;
  width:320px;
  text-align:center;
  box-shadow:0 0 40px rgba(255,215,0,0.2);
}

h1{
  color:#FFD700;
  margin-bottom:10px;
}

p{
  font-size:14px;
  color:#9ca3af;
}

input{
  width:100%;
  padding:12px;
  margin-top:15px;
  border-radius:10px;
  border:none;
  outline:none;
  font-size:14px;
}

button{
  width:100%;
  padding:12px;
  margin-top:20px;
  background:#FFD700;
  border:none;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#e6c200;
}

#message{
  margin-top:15px;
  font-size:14px;
}

.success{
  color:#22c55e;
}

.error{
  color:#ef4444;
}
</style>
</head>

<body>

<div class="container">
  <h1>BullBear Market</h1>
  <p>Reset your account password securely</p>

  <input type="password" id="password" placeholder="New Password">

  <button onclick="resetPassword()">Reset Password</button>

  <div id="message"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBym_d2afkPk-ErzyIj4bFCdZeWue4MtAY",
  authDomain: "bullbearmarket7.firebaseapp.com",
  projectId: "bullbearmarket7",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const urlParams = new URLSearchParams(window.location.search);
const oobCode = urlParams.get("oobCode");

window.resetPassword = async function(){
  const pass = document.getElementById("password").value;
  const msg = document.getElementById("message");

  if(pass.length < 6){
    msg.innerText = "Password must be at least 6 characters";
    msg.className = "error";
    return;
  }

  try{
    await confirmPasswordReset(auth, oobCode, pass);
    msg.innerText = "Password reset successful 🎉";
    msg.className = "success";

    setTimeout(()=>{
      window.location.href = "https://bullbearmarket.in";
    },2000);

  }catch(e){
    msg.innerText = e.message;
    msg.className = "error";
  }
}
</script>

</body>
</html>
