<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password • BullBear Market</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0b0f19,#121826);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container {
    width:90%;
    max-width:420px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    padding:30px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

.logo {
    width:80px;
    margin-bottom:15px;
}

h2 {
    color:#FFD700;
    margin-bottom:10px;
}

p {
    font-size:14px;
    color:#aaa;
}

input {
    width:100%;
    padding:12px;
    margin-top:15px;
    border-radius:10px;
    border:none;
    outline:none;
    font-size:14px;
}

button {
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#FFD700;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover {
    background:#e6c200;
}

.success {
    color:#4CAF50;
    margin-top:15px;
}

.error {
    color:#ff4d4d;
    margin-top:15px;
}

@media (max-width:500px){
    .container{
        padding:20px;
    }
}
</style>
</head>

<body>

<div class="container">

<img src="https://bullbearmarket.in/fevicon.png" class="logo">

<h2>Reset Your Password</h2>

<p>
Enter a new secure password for your BullBear Market account.<br>
Make sure it's strong and unique.
</p>

<input type="password" id="newPassword" placeholder="New Password">
<input type="password" id="confirmPassword" placeholder="Confirm Password">

<button id="resetBtn">Reset Password</button>

<p id="message"></p>

</div>

<!-- Firebase Script -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyBym_d2afkPk-ErzyIj4bFCdZeWue4MtAY",
  authDomain: "bullbearmarket7.firebaseapp.com",
  databaseURL: "https://bullbearmarket7-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bullbearmarket7",
  storageBucket: "bullbearmarket7.firebasestorage.app",
  messagingSenderId: "796295002353",
  appId: "1:796295002353:web:5ced1f7e2501b9c46c5150"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔥 Get Code from URL
const params = new URLSearchParams(window.location.search);
const oobCode = params.get("oobCode");

const btn = document.getElementById("resetBtn");
const msg = document.getElementById("message");

btn.addEventListener("click", async () => {

    const pass = document.getElementById("newPassword").value;
    const confirm = document.getElementById("confirmPassword").value;

    if(pass.length < 6){
        msg.innerText = "Password must be at least 6 characters";
        msg.className = "error";
        return;
    }

    if(pass !== confirm){
        msg.innerText = "Passwords do not match";
        msg.className = "error";
        return;
    }

    try{
        await confirmPasswordReset(auth, oobCode, pass);

        msg.innerText = "Password reset successful 🎉";
        msg.className = "success";

        setTimeout(()=>{
            window.location.href = "https://bullbearmarket.in";
        },2000);

    }catch(err){
        msg.innerText = err.message;
        msg.className = "error";
    }

});

</script>

</body>
</html>
