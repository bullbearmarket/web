<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BullBear Leaderboard</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"></script>

<style>

body {
  background:#0D1117;
  color:white;
  font-family:sans-serif;
  margin:0;
}

h1 {
  text-align:center;
  padding:15px;
}

.tabs {
  display:flex;
  justify-content:center;
  gap:10px;
}

.tabs button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#161B22;
  color:white;
}

.active{
  background:#FFD700;
  color:black;
}

.top3 {
  display:flex;
  justify-content:space-around;
  margin:20px;
}

.card{
  background:#161B22;
  padding:15px;
  border-radius:15px;
  text-align:center;
  width:28%;
}

.gold{background:gold;color:black;}
.silver{background:silver;color:black;}
.bronze{background:#cd7f32;}

.list{
  padding:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  background:#161B22;
  margin:8px 0;
  padding:12px;
  border-radius:10px;
}

.pro{
  color:gold;
}

</style>
</head>

<body>

<h1>🏆 Leaderboard</h1>

<div class="tabs">
  <button id="monthlyBtn" class="active">Monthly</button>
  <button id="weeklyBtn">Weekly</button>
</div>

<div id="top3" class="top3"></div>
<div id="list" class="list"></div>

<script>

const firebaseConfig = {
  databaseURL: "https://bullbearmarket7-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let mode = "monthly";

document.getElementById("monthlyBtn").onclick = ()=>load("monthly");
document.getElementById("weeklyBtn").onclick = ()=>load("weekly");

function load(type){
  mode = type;

  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  document.getElementById(type+"Btn").classList.add("active");

  db.ref("leaderboardCache/"+type).once("value", snap=>{
    let arr=[];

    snap.forEach(s=>{
      let val=s.val();
      val.uid=s.val().uid;
      arr.push(val);
    });

    arr.sort((a,b)=>b.profit-a.profit);

    render(arr);
  });
}

function render(data){

  let top3HTML="";
  let listHTML="";

  data.slice(0,3).forEach((u,i)=>{

    let cls = i==0?"gold":i==1?"silver":"bronze";

    top3HTML += `
    <div class="card ${cls}">
      <h3>#${i+1}</h3>
      <p id="name${i}">Loading...</p>
      <b>₹${u.profit}</b>
    </div>`;
  });

  document.getElementById("top3").innerHTML = top3HTML;

  data.slice(0,50).forEach((u,i)=>{

    listHTML += `
    <div class="row">
      <div>#${i+1} <span id="nameList${i}">Loading...</span></div>
      <div>₹${u.profit}</div>
    </div>`;
  });

  document.getElementById("list").innerHTML = listHTML;

  // 🔥 NAME + PRO FETCH
  data.slice(0,50).forEach((u,i)=>{

    db.ref("users/"+u.uid).once("value",snap=>{
      let name = snap.val()?.name || "Trader";
      let pro = snap.val()?.isPro;

      let finalName = name + (pro ? " 👑" : "");

      if(i<3){
        document.getElementById("name"+i).innerText = finalName;
      }

      document.getElementById("nameList"+i).innerText = finalName;
    });

  });

}

load("monthly");

</script>

</body>
</html>
