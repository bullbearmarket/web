<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BullBear Market Rewards</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"></script>

<style>

body{
  background:#0D1117;
  color:white;
  font-family:sans-serif;
  margin:0;
}

h1{
  text-align:center;
  padding:15px;
}

.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
}

.tabs button{
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#161B22;
  color:white;
  cursor:pointer;
}

.active{
  background:#FFD700;
  color:black;
}

.top3{
  display:flex;
  justify-content:space-around;
  margin:20px;
}

.card{
  background:#161B22;
  padding:15px;
  border-radius:15px;
  text-align:center;
  width:28%;
}

.gold{background:#FFD700;color:black;}
.silver{background:#C0C0C0;color:black;}
.bronze{background:#CD7F32;}

.list{
  padding:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  background:#161B22;
  margin:8px;
  padding:12px;
  border-radius:10px;
}

</style>
</head>

<body>

<h1>🏆 Rewards</h1>

<div class="tabs">
  <button id="monthlyBtn" class="active">Monthly</button>
  <button id="weeklyBtn">Weekly</button>
</div>

<div id="top3" class="top3"></div>
<div id="list" class="list"></div>

<script>

const firebaseConfig = {
  databaseURL: "https://bullbearmarket7-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function load(type){

  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  document.getElementById(type+"Btn").classList.add("active");

  db.ref("contestRewards/"+type).once("value", snap=>{

    let data = snap.val();

    let arr = [];

    for(let rank in data){
      arr.push({
        rank: parseInt(rank),
        reward: data[rank]
      });
    }

    arr.sort((a,b)=>a.rank - b.rank);

    render(arr);

  });
}

function render(data){

  let top3HTML="";
  let listHTML="";

  data.slice(0,3).forEach((u,i)=>{

    let cls = i==0?"gold":i==1?"silver":"bronze";

    top3HTML += `
    <div class="card ${cls}">
      <h3>#${u.rank}</h3>
      <b>₹${u.reward}</b>
    </div>`;
  });

  document.getElementById("top3").innerHTML = top3HTML;

  data.slice(0,50).forEach(u=>{

    listHTML += `
    <div class="row">
      <div>#${u.rank}</div>
      <div>₹${u.reward}</div>
    </div>`;
  });

  document.getElementById("list").innerHTML = listHTML;
}

document.getElementById("monthlyBtn").onclick = ()=>load("monthly");
document.getElementById("weeklyBtn").onclick = ()=>load("weekly");

load("monthly");

</script>

</body>
</html>
