<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BullBear Rewards</title>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://bullbearmarket7-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const db = getDatabase(app);

window.loadData = async function(type){

  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  document.getElementById(type).classList.add("active");

  const snapshot = await get(ref(db, "contestRewards/" + type));

  if(!snapshot.exists()){
    document.getElementById("list").innerHTML = "<p style='text-align:center'>No data found</p>";
    return;
  }

  const data = snapshot.val();

  let arr = [];

  for(let r in data){
    arr.push({
      rank: parseInt(r),
      reward: data[r]
    });
  }

  arr.sort((a,b)=>a.rank-b.rank);

  render(arr);
}

function render(data){

  let top3 = "";
  let list = "";

  data.slice(0,3).forEach((u,i)=>{

    let cls = ["gold","silver","bronze"][i];

    top3 += `
    <div class="card ${cls}">
      <h2>#${u.rank}</h2>
      <h3>₹${u.reward}</h3>
    </div>`;
  });

  document.getElementById("top3").innerHTML = top3;

  data.slice(0,50).forEach(u=>{
    list += `
    <div class="row">
      <span>#${u.rank}</span>
      <span>₹${u.reward}</span>
    </div>`;
  });

  document.getElementById("list").innerHTML = list;
}

window.onload = ()=>loadData("monthly");

</script>

<style>

body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(180deg,#0D1117,#000);
  color:white;
}

h1{
  text-align:center;
  padding:20px;
}

.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
}

.tab{
  padding:12px 20px;
  border-radius:20px;
  background:#161B22;
  cursor:pointer;
}

.active{
  background:#FFD700;
  color:black;
}

.top3{
  display:flex;
  justify-content:center;
  gap:15px;
  margin:25px;
}

.card{
  padding:20px;
  border-radius:15px;
  width:100px;
  text-align:center;
  animation:pop 0.5s ease;
}

@keyframes pop{
  from{transform:scale(0.8);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

.gold{background:#FFD700;color:black;}
.silver{background:#C0C0C0;color:black;}
.bronze{background:#CD7F32;}

.list{
  padding:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  background:#161B22;
  padding:14px;
  margin:8px;
  border-radius:10px;
  transition:0.3s;
}

.row:hover{
  background:#1f2937;
}

</style>
</head>

<body>

<h1>🏆 Rewards</h1>

<div class="tabs">
  <div id="monthly" class="tab active" onclick="loadData('monthly')">Monthly</div>
  <div id="weekly" class="tab" onclick="loadData('weekly')">Weekly</div>
</div>

<div id="top3" class="top3"></div>
<div id="list" class="list"></div>

</body>
</html>
