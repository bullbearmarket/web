<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    
    <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.bullbearmarket.app">
    
    <title>Bull Bear Market</title>
    
    <style>
        /* Base Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        /* Premium Navy Blue Gradient Background */
        body {
            background: linear-gradient(135deg, #070e20 0%, #0d1a3a 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Glassmorphism Card Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 24px;
            padding: 40px 50px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Premium Dual-Ring Gold Spinner */
        .spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 24px auto;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #FFDF00;
            border-right-color: #D4AF37;
            animation: spin 1s linear infinite;
            position: relative;
        }
        
        .spinner::before {
            content: "";
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #FFDF00;
            opacity: 0.5;
            animation: spin 2s linear infinite reverse;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Gold Gradient Brand Typography */
        .brand-name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-text {
            font-size: 14px;
            color: #A0AABF;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Invisible Fallback to keep UI clean */
        .fallback {
            position: absolute;
            bottom: -50px;
            font-size: 10px;
            opacity: 0;
            z-index: -1;
        }
    </style>

    <script type="text/javascript">
        // Primary JS Redirect (Replaces history so back button works smoothly)
        window.onload = function() {
            window.location.replace("https://play.google.com/store/apps/details?id=com.bullbearmarket.app");
        };
    </script>
</head>
<body>
    
    <div class="glass-card">
        <div class="spinner"></div>
        <div class="brand-name">BULL BEAR MARKET</div>
        <div class="status-text">Opening secure gateway...</div>
    </div>
    
    <div class="fallback">
        <a href="https://play.google.com/store/apps/details?id=com.bullbearmarket.app">Proceed</a>
    </div>

</body>
</html>
