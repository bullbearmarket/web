<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.bullbearmarket.app">
    
    <title>Opening Bull Bear Market...</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0B132B; /* Premium Navy Blue Background */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            text-align: center;
        }
        /* Small professional loading circle */
        .loader {
            border: 3px solid rgba(255, 215, 0, 0.2); 
            border-top: 3px solid #FFD700; /* Gold accent */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        /* Hidden link just in case redirect fails completely */
        .fallback {
            font-size: 10px;
            color: #444;
            margin-top: 20px;
        }
        .fallback a {
            color: #444;
            text-decoration: none;
        }
    </style>

    <script type="text/javascript">
        // Replace current history state so the 'Back' button works normally
        window.onload = function() {
            window.location.replace("https://play.google.com/store/apps/details?id=com.bullbearmarket.app");
        };
    </script>
</head>
<body>
    
    <div class="container">
        <div class="loader"></div>
        <div class="message">Bull Bear Market is opening...</div>
        
        <div class="fallback">
            Please wait. <a href="https://play.google.com/store/apps/details?id=com.bullbearmarket.app">Click here</a>
        </div>
    </div>

</body>
</html>
